name: Dependabot auto-merge

# Enables GitHub auto-merge on Dependabot PRs for minor and patch bumps, so they
# land on their own once the required CI checks pass. Majors are left for a
# human. Requires "Allow auto-merge" in the repository settings and a branch
# protection rule / ruleset on main with the CI job as a required check;
# without required checks, auto-merge would merge immediately.
on:
  pull_request:

permissions:
  contents: read

jobs:
  auto-merge:
    name: Enable auto-merge for minor and patch updates
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'aleph-void/Conway-s-Sequencer'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
